<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AHCLPW313 – Teacher Presentation Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0d4b6b;
            --primary-light: #2a7a9e;
            --accent: #e68a2e;
            --accent-soft: #fef0dd;
            --bg: #f4f9fc;
            --border: #c9dde8;
            --text: #1a2e3b;
            --text-light: #5a7a8e;
            --shadow: 0 12px 28px -8px rgba(0, 30, 50, 0.15);
            --radius: 1.2rem;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #e0eaf0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .presenter {
            max-width: 1300px;
            width: 100%;
            background: white;
            border-radius: 2rem;
            overflow: hidden;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            height: 95vh;
            max-height: 1000px;
        }

        /* ===== HEADER ===== */
        .header {
            background: linear-gradient(145deg, #0a3b52, #146a8a);
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            border-bottom: 4px solid var(--accent);
        }

        .header h1 {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .header h1 i {
            color: var(--accent);
            margin-right: 8px;
        }

        .header .session-indicator {
            background: rgba(255, 255, 255, 0.15);
            padding: 0.3rem 1rem;
            border-radius: 60px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* ===== MAIN CONTENT ===== */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 2rem 2.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        /* ===== SESSION CARD (current) ===== */
        .session-card {
            animation: fadeSlide 0.35s ease;
        }

        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .session-number-badge {
            display: inline-block;
            background: var(--primary);
            color: white;
            font-weight: 700;
            padding: 0.2rem 1rem;
            border-radius: 60px;
            font-size: 0.8rem;
            margin-bottom: 0.3rem;
        }

        .session-title {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 0.2rem;
        }

        .session-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            font-size: 0.95rem;
            color: var(--text-light);
            margin-bottom: 1.2rem;
        }

        .session-meta i {
            margin-right: 0.3rem;
        }

        /* ===== OUTCOMES ===== */
        .outcomes-box {
            background: var(--bg);
            border-radius: var(--radius);
            padding: 1.2rem 1.6rem;
            border-left: 6px solid var(--primary-light);
        }

        .outcomes-box h3 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-light);
            margin-bottom: 0.3rem;
        }

        .outcomes-box ul {
            list-style: none;
            padding-left: 0;
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem 1.5rem;
        }

        .outcomes-box li::before {
            content: "▹ ";
            color: var(--accent);
            font-weight: 700;
        }

        /* ===== ACTIVITIES ===== */
        .activities-box {
            background: white;
            border-radius: var(--radius);
            padding: 1.2rem 1.6rem;
            border: 2px solid var(--border);
        }

        .activities-box h3 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-light);
            margin-bottom: 0.5rem;
        }

        .activities-box ul {
            list-style: none;
            padding-left: 0;
        }

        .activities-box li {
            padding: 0.4rem 0 0.4rem 1.8rem;
            position: relative;
            border-bottom: 1px solid #f0f4f8;
        }

        .activities-box li:last-child {
            border-bottom: none;
        }

        .activities-box li::before {
            content: "◆";
            color: var(--primary-light);
            position: absolute;
            left: 0;
            font-weight: 700;
        }

        .app-tag {
            display: inline-block;
            background: var(--accent-soft);
            border-left: 4px solid var(--accent);
            padding: 0.1rem 0.6rem;
            border-radius: 0.3rem;
            font-size: 0.9rem;
        }

        .tab-ref {
            display: inline-block;
            background: var(--primary);
            color: white;
            font-weight: 600;
            padding: 0.05rem 0.6rem;
            border-radius: 12px;
            font-size: 0.7rem;
            letter-spacing: 0.3px;
        }

        /* ===== PROMPTS ===== */
        .prompts-box {
            background: #f0f7fc;
            border-radius: var(--radius);
            padding: 1rem 1.6rem;
            border-left: 6px solid var(--accent);
        }

        .prompts-box h3 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-light);
            margin-bottom: 0.3rem;
        }

        .prompts-box p {
            font-style: italic;
            margin: 0.2rem 0;
            color: var(--text);
        }

        .prompts-box strong {
            color: var(--primary);
            font-style: normal;
        }

        /* ===== APP PREVIEW AREA ===== */
        .app-preview {
            background: #eaf3f9;
            border-radius: var(--radius);
            padding: 1rem 1.6rem;
            border: 2px dashed var(--border);
            display: flex;
            align-items: center;
            gap: 1.2rem;
            flex-wrap: wrap;
            margin-top: 0.5rem;
        }

        .app-preview .tabs-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
        }

        .app-preview .tab-pill {
            background: var(--primary);
            color: white;
            padding: 0.2rem 0.9rem;
            border-radius: 60px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .app-preview .tab-pill.inactive {
            background: #c9dde8;
            color: #4a6a7e;
        }

        .app-preview .hint {
            font-size: 0.85rem;
            color: var(--text-light);
        }

        .app-preview .hint i {
            color: var(--accent);
        }

        /* ===== CONTROLS ===== */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 2rem;
            background: var(--bg);
            border-top: 2px solid var(--border);
            flex-shrink: 0;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .controls .nav-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .controls button {
            background: white;
            border: 2px solid var(--border);
            border-radius: 60px;
            padding: 0.4rem 1.2rem;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text);
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .controls button:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .controls button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background: #e8eef2;
            color: #8a9aa8;
            border-color: #d0dce3;
        }

        .controls .session-jump {
            display: flex;
            gap: 0.3rem;
            align-items: center;
        }

        .controls .session-jump select {
            padding: 0.3rem 0.8rem;
            border-radius: 60px;
            border: 2px solid var(--border);
            font-weight: 600;
            background: white;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .controls .progress-text {
            font-size: 0.85rem;
            color: var(--text-light);
            font-weight: 600;
        }

        /* ===== SCROLLBAR ===== */
        .content::-webkit-scrollbar {
            width: 6px;
        }

        .content::-webkit-scrollbar-track {
            background: #e8eef2;
            border-radius: 10px;
        }

        .content::-webkit-scrollbar-thumb {
            background: var(--primary-light);
            border-radius: 10px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .presenter {
                height: 98vh;
                max-height: none;
                border-radius: 1rem;
            }

            .content {
                padding: 1.2rem;
            }

            .session-title {
                font-size: 1.6rem;
            }

            .header h1 {
                font-size: 0.95rem;
            }

            .header .session-indicator {
                font-size: 0.7rem;
                padding: 0.2rem 0.7rem;
            }

            .controls {
                padding: 0.6rem 1rem;
                flex-direction: column;
                align-items: stretch;
            }

            .controls .nav-buttons {
                justify-content: center;
            }

            .controls .session-jump {
                justify-content: center;
            }

            .app-preview {
                flex-direction: column;
                align-items: flex-start;
            }
        }

        @media print {
            body {
                background: white;
                padding: 0.5in;
            }
            .presenter {
                height: auto;
                max-height: none;
                box-shadow: none;
                border-radius: 0;
            }
            .controls {
                display: none;
            }
            .header {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }
    </style>
</head>
<body>

    <div class="presenter" id="presenter">
        <!-- HEADER -->
        <div class="header">
            <h1><i class="fas fa-droplet"></i> AHCLPW313 – Teacher Presentation</h1>
            <span class="session-indicator" id="sessionIndicator">Session 1 / 10</span>
        </div>

        <!-- CONTENT -->
        <div class="content" id="content">
            <!-- Rendered by JavaScript -->
        </div>

        <!-- CONTROLS -->
        <div class="controls">
            <div class="nav-buttons">
                <button id="prevBtn" onclick="prevSession()"><i class="fas fa-chevron-left"></i> Previous</button>
                <button id="nextBtn" onclick="nextSession()">Next <i class="fas fa-chevron-right"></i></button>
            </div>
            <div class="session-jump">
                <span style="font-size:0.85rem; color:var(--text-light);">Jump to:</span>
                <select id="sessionSelect" onchange="jumpToSession(parseInt(this.value))">
                    <!-- Rendered by JavaScript -->
                </select>
            </div>
            <div class="progress-text" id="progressText">1 / 10</div>
        </div>
    </div>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <script>
        // ===== SESSION DATA =====
        const sessions = [{
            number: 1,
            title: "Introduction to Water Sampling & Testing",
            meta: "Theory & Discussion · 4 hours",
            outcomes: [
                "Understand the importance of water quality testing",
                "Identify key legislative and workplace requirements",
                "Recognise different water sampling techniques"
            ],
            activities: [
                { text: "Navigate to <span class='tab-ref'>Tab 1</span> – Why test water? Use the interactive cards and Australian context section to facilitate group discussion.", isApp: true },
                { text: "Presentation & Video: Use content from <span class='tab-ref'>Tab 1</span> as a presentation guide. Watch recommended videos from <span class='tab-ref'>Tab 8</span> (Resources).", isApp: false },
                { text: "Self-Directed Learning: Explore <span class='tab-ref'>Tab 1</span> and <span class='tab-ref'>Tab 2</span> (Key parameters) to research local water bodies.", isApp: false }
            ],
            prompts: [
                "What are some key factors affecting water quality in our region? Use the 'Australia's unique challenges' section in <span class='tab-ref'>Tab 1</span>.",
                "Why do different industries have different water quality standards? Check the 'Compliance & regulations' card in <span class='tab-ref'>Tab 1</span>."
            ],
            tabs: [1, 2, 8]
        }, {
            number: 2,
            title: "Planning for Water Sampling",
            meta: "Planning & Risk Assessment · 4 hours",
            outcomes: [
                "Develop a water sampling plan",
                "Identify safe work procedures and risk assessments"
            ],
            activities: [
                { text: "Groups complete a case study using the 'Sampling Plan' template from <span class='tab-ref'>Tab 8</span> (Downloadable resources).", isApp: true },
                { text: "Workshop: Hazard identification using <span class='tab-ref'>Tab 4</span> (Planning & safety). Complete the 'Risk Assessment' template from <span class='tab-ref'>Tab 8</span>.", isApp: false },
                { text: "Self-Directed Learning: Read <span class='tab-ref'>Tab 4</span> (Planning & safety) to prepare for the field trip.", isApp: false }
            ],
            prompts: [
                "What risks might be present when sampling in different environments? Use the 'Risk assessment essentials' in <span class='tab-ref'>Tab 4</span>.",
                "How can you ensure consistency in sampling techniques? Review the 'Quality assurance' guidelines in <span class='tab-ref'>Tab 3</span>."
            ],
            tabs: [3, 4, 8]
        }, {
            number: 3,
            title: "Field Techniques for Water Sampling",
            meta: "Field Practical · 4 hours",
            outcomes: [
                "Demonstrate correct water sampling techniques",
                "Follow chain of custody procedures"
            ],
            activities: [
                { text: "Pre-Field Briefing: Review <span class='tab-ref'>Tab 4</span> (Planning & safety) and <span class='tab-ref'>Tab 5</span> (Samples & dispatch) for checklists.", isApp: false },
                { text: "In Field: Students access <span class='tab-ref'>Tab 3</span> (Equipment & methods) and <span class='tab-ref'>Tab 5</span> (Samples & dispatch) on mobile devices for real-time reference.", isApp: true },
                { text: "Self-Directed Learning: Document field observations using the 'Field Data Sheet' template from <span class='tab-ref'>Tab 8</span>.", isApp: false }
            ],
            prompts: [
                "Why is it important to label and preserve samples correctly? Check the 'Preservation & storage' section in <span class='tab-ref'>Tab 5</span>.",
                "What factors can influence sample contamination? Review the 'Best practice' list in <span class='tab-ref'>Tab 3</span>."
            ],
            tabs: [3, 4, 5, 8]
        }, {
            number: 4,
            title: "On-Site Water Testing Methods",
            meta: "Practical Testing · 4 hours",
            outcomes: [
                "Conduct on-site testing for pH, temperature, and dissolved oxygen"
            ],
            activities: [
                { text: "Practical Session: Use handheld meters guided by <span class='tab-ref'>Tab 3</span> (Equipment & methods). Use <span class='tab-ref'>Tab 9</span> (Simulator) to predict how conditions affect readings.", isApp: false },
                { text: "Interpret real-time results using the 'Normal Ranges' table in <span class='tab-ref'>Tab 6</span> (Interpreting results).", isApp: true },
                { text: "Self-Directed Learning: Research common water pollutants using <span class='tab-ref'>Tab 2</span> (Key parameters).", isApp: false }
            ],
            prompts: [
                "How do environmental conditions impact on-site test results? Use the simulator in <span class='tab-ref'>Tab 9</span> to see the effect of temperature on DO.",
                "What limitations do field tests have compared to lab tests? Compare information in <span class='tab-ref'>Tab 3</span> (Field) and <span class='tab-ref'>Tab 6</span> (Interpretation)."
            ],
            tabs: [2, 3, 6, 9]
        }, {
            number: 5,
            title: "Laboratory Testing & Data Interpretation",
            meta: "Lab Analysis · 4 hours",
            outcomes: [
                "Understand laboratory analysis techniques",
                "Interpret water quality data"
            ],
            activities: [
                { text: "Guest Speaker/Video: Use resources from <span class='tab-ref'>Tab 8</span> (Resources & glossary) to find lab tours or AST links.", isApp: false },
                { text: "Data analysis workshop using <span class='tab-ref'>Tab 6</span> (Interpreting results) and the 'Trigger Levels' table in <span class='tab-ref'>Tab 8</span>.", isApp: true },
                { text: "Self-Directed Learning: Write a reflection on lab processes using <span class='tab-ref'>Tab 5</span> (Samples & dispatch) – Chain of Custody section.", isApp: false }
            ],
            prompts: [
                "What are the advantages of lab testing over field testing? Compare <span class='tab-ref'>Tab 3</span> and <span class='tab-ref'>Tab 6</span>.",
                "How can data trends inform environmental management decisions? Use the 'Case study' in <span class='tab-ref'>Tab 6</span> as an example."
            ],
            tabs: [5, 6, 8]
        }, {
            number: 6,
            title: "Assessing & Reporting Water Quality",
            meta: "Reporting · 4 hours",
            outcomes: [
                "Compare test results to water quality guidelines",
                "Document findings in a report"
            ],
            activities: [
                { text: "Group presentations using data from field work. Justify conclusions using guidelines in <span class='tab-ref'>Tab 1</span> and <span class='tab-ref'>Tab 6</span>.", isApp: true },
                { text: "Report Writing: Use <span class='tab-ref'>Tab 7</span> (Test your knowledge) and <span class='tab-ref'>Tab 8</span> (Resources) as reference.", isApp: false },
                { text: "Self-Directed Learning: Review a government water quality report using the app to understand terminology.", isApp: false }
            ],
            prompts: [
                "What challenges arise when interpreting water quality data? Refer to 'Common issues & what they mean' and 'Diurnal and seasonal variation' in <span class='tab-ref'>Tab 6</span>.",
                "How can reporting influence environmental decision-making? Review the 'When to report urgently' checklist in <span class='tab-ref'>Tab 6</span>."
            ],
            tabs: [1, 6, 7, 8]
        }, {
            number: 7,
            title: "Water Quality Management Strategies",
            meta: "Management & Remediation · 4 hours",
            outcomes: [
                "Identify water quality management strategies",
                "Understand remediation methods"
            ],
            activities: [
                { text: "Use the 'Scenarios' in <span class='tab-ref'>Tab 7</span> (Test your knowledge) to discuss pollution events and brainstorm responses.", isApp: true },
                { text: "Self-Directed Learning: Research catchment management best practices using <span class='tab-ref'>Tab 8</span> (Resources) and the case study in <span class='tab-ref'>Tab 6</span>.", isApp: false }
            ],
            prompts: [
                "What are some common causes of water contamination? Review <span class='tab-ref'>Tab 2</span> (Key parameters) to understand what each pollutant indicates.",
                "How can land management practices improve water quality? Consider the findings from the 'Healthy' vs. 'Eutrophic' scenarios in <span class='tab-ref'>Tab 9</span> (Simulator)."
            ],
            tabs: [2, 6, 7, 8, 9]
        }, {
            number: 8,
            title: "Advanced Water Testing Techniques",
            meta: "Advanced Practical · 4 hours",
            outcomes: [
                "Conduct advanced testing methods (turbidity, salinity, EC, BOD)"
            ],
            activities: [
                { text: "Hands-On Practical: Use advanced sensors referencing <span class='tab-ref'>Tab 3</span> (Equipment & methods).", isApp: false },
                { text: "Data comparison exercise using <span class='tab-ref'>Tab 9</span> (Simulator) to change parameters and replicate field vs. lab comparisons.", isApp: true },
                { text: "Self-Directed Learning: Research macroinvertebrates in water quality assessment using resources in <span class='tab-ref'>Tab 8</span>.", isApp: false }
            ],
            prompts: [
                "How do different pollutants impact water ecosystems? Use the <span class='tab-ref'>Tab 9</span> Simulator to see how high nutrients and temperature affect DO.",
                "What role does biodiversity play in water health monitoring? Relate this back to the 'Protect human & ecosystem health' section in <span class='tab-ref'>Tab 1</span>."
            ],
            tabs: [1, 3, 8, 9]
        }, {
            number: 9,
            title: "Final Field Assessment",
            meta: "Summative Practical · 4 hours",
            outcomes: [
                "Demonstrate proficiency in field sampling and testing",
                "Apply risk management strategies"
            ],
            activities: [
                { text: "In Field: Independent field assessment using <span class='tab-ref'>Tab 5</span> (Samples & dispatch) and <span class='tab-ref'>Tab 4</span> (Planning & safety) as quick-reference guides.", isApp: true },
                { text: "Peer Review: Students give feedback using best-practice guides in the app.", isApp: false },
                { text: "Self-Directed Learning: Prepare summary report using 'Field Data Sheet' and 'Sampling Plan' templates from <span class='tab-ref'>Tab 8</span>.", isApp: false }
            ],
            prompts: [
                "What challenges did you encounter in the field? Could you use the app's troubleshooting tips to resolve them?",
                "How would you improve your sampling approach next time?"
            ],
            tabs: [3, 4, 5, 8]
        }, {
            number: 10,
            title: "Review & Assessment Submission",
            meta: "Final Review · 4 hours",
            outcomes: [
                "Finalise and submit reports",
                "Reflect on learning outcomes"
            ],
            activities: [
                { text: "Complete the <span class='tab-ref'>Tab 7</span> (Test your knowledge) quiz as a final self-assessment.", isApp: true },
                { text: "Peer Presentations: Students present reports using the app to show data and decision-making.", isApp: false },
                { text: "Final Assessment Submission: Submit reports built using the app's templates.", isApp: false },
                { text: "Group Discussion: Reflect on learning using the 'Your progress' bars and key takeaways from each tab.", isApp: false }
            ],
            prompts: [
                "How has your understanding of water sampling changed? Reflect on your journey through the app's 9 tabs.",
                "What are some key takeaways from this unit? Use the 'Ready for assessment!' checklist in <span class='tab-ref'>Tab 8</span> to guide your final thoughts."
            ],
            tabs: [7, 8]
        }];

        // ===== STATE =====
        let currentIndex = 0;

        // ===== RENDER =====
        function renderSession(index) {
            const session = sessions[index];
            if (!session) return;

            const content = document.getElementById('content');

            // Build tabs display
            const tabsHtml = session.tabs.map(t =>
                `<span class="tab-pill">Tab ${t}</span>`
            ).join('');

            content.innerHTML = `
                <div class="session-card">
                    <span class="session-number-badge">Session ${session.number} / ${sessions.length}</span>
                    <div class="session-title">${session.title}</div>
                    <div class="session-meta">
                        <span><i class="fas fa-clock"></i> ${session.meta}</span>
                    </div>

                    <div class="outcomes-box">
                        <h3><i class="fas fa-bullseye"></i> Learning Outcomes</h3>
                        <ul>
                            ${session.outcomes.map(o => `<li>${o}</li>`).join('')}
                        </ul>
                    </div>

                    <div class="activities-box">
                        <h3><i class="fas fa-tasks"></i> Activities</h3>
                        <ul>
                            ${session.activities.map(a => `
                                <li>
                                    ${a.isApp ? `<span class="app-tag">📱 App Activity:</span> ` : ''}
                                    ${a.text}
                                </li>
                            `).join('')}
                        </ul>
                    </div>

                    <div class="prompts-box">
                        <h3><i class="fas fa-comment-dots"></i> Teacher Prompts</h3>
                        ${session.prompts.map(p => `<p><strong>→</strong> ${p}</p>`).join('')}
                    </div>

                    <div class="app-preview">
                        <div>
                            <i class="fas fa-tablet-alt" style="color:var(--primary); font-size:1.2rem;"></i>
                            <span style="font-weight:600; margin-left:6px;">Students should have open:</span>
                        </div>
                        <div class="tabs-row">
                            ${tabsHtml}
                        </div>
                        <div class="hint">
                            <i class="fas fa-lightbulb"></i> Display this session on the big screen while students follow along on their devices.
                        </div>
                    </div>
                </div>
            `;

            // Update controls
            document.getElementById('sessionIndicator').textContent = `Session ${session.number} / ${sessions.length}`;
            document.getElementById('progressText').textContent = `${session.number} / ${sessions.length}`;
            document.getElementById('sessionSelect').value = index;

            // Update buttons
            document.getElementById('prevBtn').disabled = (index === 0);
            document.getElementById('nextBtn').disabled = (index === sessions.length - 1);

            // Scroll to top
            content.scrollTop = 0;
        }

        // ===== NAVIGATION =====
        function nextSession() {
            if (currentIndex < sessions.length - 1) {
                currentIndex++;
                renderSession(currentIndex);
            }
        }

        function prevSession() {
            if (currentIndex > 0) {
                currentIndex--;
                renderSession(currentIndex);
            }
        }

        function jumpToSession(index) {
            if (index >= 0 && index < sessions.length) {
                currentIndex = index;
                renderSession(currentIndex);
            }
        }

        // ===== KEYBOARD SHORTCUTS =====
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === ' ') {
                e.preventDefault();
                nextSession();
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                prevSession();
            } else if (e.key >= '1' && e.key <= '9') {
                const num = parseInt(e.key);
                if (num <= sessions.length) {
                    jumpToSession(num - 1);
                }
            }
        });

        // ===== INIT =====
        function init() {
            // Populate session dropdown
            const select = document.getElementById('sessionSelect');
            sessions.forEach((s, i) => {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = `Session ${s.number}: ${s.title}`;
                select.appendChild(opt);
            });

            renderSession(0);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>

</body>
</html>
